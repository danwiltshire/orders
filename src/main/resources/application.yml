server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: orders-demo
  datasource:
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 5000
  flyway:
    connect-retries: 30
    connect-retries-interval: 2s
  rabbitmq:
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: true
        recovery-interval: 5000
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
          max-attempts: 5
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,dependencies
