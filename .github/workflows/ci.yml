name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-ui:
    uses: danwiltshire/github-workflows/.github/workflows/build-image.yml@main
    with:
      architecture: arm64
      context: ./ui
      file: ./ui/Dockerfile
      tag-prefix: ui
    secrets: inherit

  build-api:
    uses: danwiltshire/github-workflows/.github/workflows/build-image.yml@main
    with:
      architecture: arm64
      context: .
      file: ./Dockerfile
      tag-prefix: api
    secrets: inherit

  promote-to-prod:
    uses: danwiltshire/github-workflows/.github/workflows/update-gitops-values.yml@main
    if: github.event_name == 'push'
    needs:
      - build-ui
      - build-api
    secrets: inherit
    with:
      application: ${{ github.event.repository.name }}
      environment: prod
      values: |
        api:
          imageTag: "${{ needs.build-api.outputs.sha-tag }}"
        ui:
          imageTag: "${{ needs.build-ui.outputs.sha-tag }}"